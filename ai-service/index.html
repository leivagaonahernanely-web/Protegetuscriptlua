<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Asistente privado</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #0b0b10; color: #f5f5f8; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; min-height: 100vh; box-sizing: border-box; }
  h1 { font-size: 18px; margin: 8px 0 12px; }
  #log { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding: 4px 0 12px; }
  .msg { max-width: 85%; padding: 9px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: rgba(255,255,255,.12); }
  .assistant { align-self: flex-start; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); }
  .pending { color: #9a9aa8; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.18); background: #14141c; color: inherit; font: inherit; }
  button { padding: 10px 14px; border-radius: 10px; border: 0; background: #e6e6ee; color: #0b0b10; font: 600 14px system-ui, sans-serif; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #gate { display: flex; flex-direction: column; gap: 10px; margin-top: 30vh; }
  #err { color: #ff8a8a; font-size: 14px; min-height: 1em; }
</style>
</head>
<body>
<main>
  <div id="gate">
    <h1>Asistente privado</h1>
    <form id="gateForm">
      <input id="token" type="password" placeholder="Token del servicio" autocomplete="off" required>
      <button type="submit">Entrar</button>
    </form>
    <div id="err"></div>
  </div>
  <div id="app" hidden>
    <h1>Asistente de Vantarmor</h1>
    <div id="log" aria-live="polite"></div>
    <form id="askForm" autocomplete="off">
      <input id="msg" maxlength="1500" placeholder="Pregunta algo…" aria-label="Pregunta" required>
      <button type="submit" id="send">Enviar</button>
    </form>
  </div>
</main>
<script>
(() => {
  const TOKEN_KEY = 'vmAiToken';
  const history = [];
  const $ = id => document.getElementById(id);
  const add = (role, text) => {
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    d.textContent = text;
    $('log').appendChild(d);
    $('log').scrollTop = $('log').scrollHeight;
    return d;
  };
  const call = async (path, body) => {
    const tok = sessionStorage.getItem(TOKEN_KEY) || '';
    const r = await fetch(path, {
      method: body ? 'POST' : 'GET',
      headers: { 'content-type': 'application/json', authorization: 'Bearer ' + tok },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(data.error || 'Error ' + r.status), { status: r.status });
    return data;
  };
  const open = () => { $('gate').hidden = true; $('app').hidden = false; $('msg').focus(); };
  const lock = () => { sessionStorage.removeItem(TOKEN_KEY); $('app').hidden = true; $('gate').hidden = false; };

  $('gateForm').addEventListener('submit', async e => {
    e.preventDefault();
    sessionStorage.setItem(TOKEN_KEY, $('token').value.trim());
    $('err').textContent = '';
    try {
      await call('/api/status');
      open();
    } catch (err) {
      sessionStorage.removeItem(TOKEN_KEY);
      $('err').textContent = err.status === 401 ? 'Token incorrecto.' : err.message;
    }
  });

  $('askForm').addEventListener('submit', async e => {
    e.preventDefault();
    const text = $('msg').value.trim();
    if (!text) return;
    $('msg').value = '';
    add('user', text);
    const btn = $('send');
    btn.disabled = true;
    const wait = add('assistant pending', 'Pensando…');
    try {
      const r = await call('/api/ask', { message: text, history: history.slice(-8) });
      wait.remove();
      add('assistant', r.reply);
      history.push({ role: 'user', content: text }, { role: 'assistant', content: r.reply });
    } catch (err) {
      wait.remove();
      if (err.status === 401) lock();
      add('assistant', err.message);
    } finally {
      btn.disabled = false;
      $('msg').focus();
    }
  });

  if (sessionStorage.getItem(TOKEN_KEY)) call('/api/status').then(open).catch(lock);
})();
</script>
</body>
</html>
