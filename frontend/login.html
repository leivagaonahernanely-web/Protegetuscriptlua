<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Vantarmor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08080a;
    --bg-2: #0d0d10;
    --panel: #121216;
    --panel-2: #1a1a20;
    --panel-3: #212128;
    --border: #26262e;
    --border-2: #32323c;
    --border-3: #42424e;
    --text: #f5f5f8;
    --text-dim: #a8a8b4;
    --muted: #6e6e78;
    --muted-2: #4a4a54;
    --silver-1: #f5f5f8;
    --silver-2: #d0d0d8;
    --silver-3: #a0a0ac;
    --ok: #22c55e;
    --danger: #ef4444;
    --discord: #5865f2;
    --transition: .25s cubic-bezier(.4,0,.2,1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(ellipse 70% 50% at 50% -10%, rgba(224,224,232,.09), transparent 70%),
      radial-gradient(ellipse 50% 40% at 100% 110%, rgba(160,160,172,.06), transparent 70%),
      var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: -50%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 20%, rgba(224,224,232,.08), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(160,160,172,.05), transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(224,224,232,.02), transparent 60%);
    animation: ambientFloat 30s ease-in-out infinite;
  }

  @keyframes ambientFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(3%, -3%) scale(1.05); }
    66%      { transform: translate(-3%, 3%) scale(0.98); }
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 50%, black 20%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 50%, black 20%, transparent 80%);
  }

  a { color: inherit; text-decoration: none; }
  button { cursor: pointer; font: inherit; }

  .login-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border-2);
    border-radius: 20px;
    padding: 40px 36px 32px;
    box-shadow:
      0 30px 80px -20px rgba(0,0,0,.9),
      0 0 60px -20px rgba(224,224,232,.1),
      inset 0 1px 0 rgba(255,255,255,.05);
    animation: cardIn .7s cubic-bezier(.16,1,.3,1);
    overflow: hidden;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .login-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--silver-1), transparent);
  }

  .logo-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }

  .logo {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: linear-gradient(135deg, #f5f5f8 0%, #d0d0d8 35%, #a0a0ac 70%, #70707c 100%);
    display: grid;
    place-items: center;
    color: var(--bg);
    font-weight: 900;
    font-size: 24px;
    letter-spacing: -.06em;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 12px 40px -8px rgba(0,0,0,.8),
      0 0 40px -10px rgba(224,224,232,.3),
      inset 0 1px 2px rgba(255,255,255,.7);
  }

  .logo::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.7) 50%, transparent 70%);
    transform: translateX(-150%);
    animation: logoShine 4s infinite;
  }

  @keyframes logoShine {
    0%, 100% { transform: translateX(-150%); }
    50%      { transform: translateX(150%); }
  }

  .title {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -.025em;
    text-align: center;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #ffffff 0%, #a0a0ac 50%, #ffffff 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shineText 6s ease-in-out infinite;
  }

  @keyframes shineText {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  .subtitle {
    text-align: center;
    color: var(--text-dim);
    font-size: 13.5px;
    margin-bottom: 32px;
  }

  .btn-discord {
    width: 100%;
    padding: 14px 18px;
    background: linear-gradient(135deg, #5865f2, #4752c4);
    border: 0;
    border-radius: 11px;
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: .02em;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    box-shadow:
      0 4px 14px -4px rgba(88,101,242,.5),
      inset 0 1px 0 rgba(255,255,255,.15);
    position: relative;
    overflow: hidden;
  }

  .btn-discord::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
    transform: translateX(-150%);
    transition: transform .6s;
  }

  .btn-discord:hover::before { transform: translateX(150%); }

  .btn-discord:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px -6px rgba(88,101,242,.6);
  }

  .btn-discord svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-2), transparent);
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .input-wrap {
    position: relative;
  }

  .input-wrap input {
    width: 100%;
    padding: 13px 16px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    outline: none;
    transition: all var(--transition);
  }

  .input-wrap input::placeholder {
    color: var(--muted-2);
  }

  .input-wrap input:focus {
    border-color: var(--border-3);
    background: var(--panel-3);
    box-shadow: 0 0 0 3px rgba(224,224,232,.06);
  }

  .btn-submit {
    width: 100%;
    padding: 13px 18px;
    background: linear-gradient(135deg, var(--silver-1) 0%, var(--silver-2) 50%, var(--silver-3) 100%);
    border: 0;
    border-radius: 11px;
    color: var(--bg);
    font-family: inherit;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: .08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all var(--transition);
    position: relative;
    overflow: hidden;
    margin-top: 4px;
    box-shadow: 0 4px 14px -4px rgba(224,224,232,.5);
  }

  .btn-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px -6px rgba(224,224,232,.6);
  }

  .links {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 22px;
    font-size: 13px;
  }

  .links a {
    color: var(--text-dim);
    font-weight: 600;
    transition: color var(--transition);
  }

  .links a:hover { color: var(--text); }

  .links .register { color: var(--silver-2); font-weight: 700; }

  .card-footer {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 11.5px;
    color: var(--muted);
    letter-spacing: .04em;
  }

  .card-footer a {
    color: var(--text-dim);
    font-weight: 600;
  }

  .status {
    display: none;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .status.error {
    display: block;
    background: rgba(239,68,68,.1);
    border: 1px solid rgba(239,68,68,.3);
    color: #fca5a5;
  }

  .back-link {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 10;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 15px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    transition: all var(--transition);
  }

  .back-link:hover {
    color: var(--text);
    border-color: var(--border-2);
    background: var(--panel-2);
    transform: translateX(-2px);
  }

  .back-link svg { width: 14px; height: 14px; }

  @media (max-width: 500px) {
    body { padding: 16px; }
    .login-card { padding: 32px 24px 26px; }
    .back-link { top: 12px; left: 12px; }
  }

.lang-toggle { position: fixed; top: 22px; right: 22px; z-index: 5; padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 800; letter-spacing: .08em; color: #f5f5f8; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); cursor: pointer; backdrop-filter: blur(8px); transition: background .2s, border-color .2s; }
.lang-toggle:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.22); }
</style>
</head>
<body>

<a href="/" class="back-link">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <line x1="19" y1="12" x2="5" y2="12"/>
    <polyline points="12 19 5 12 12 5"/>
  </svg>
  <span data-i18n="login_back">Volver</span>
</a>

<button id="langToggle" class="lang-toggle" type="button" aria-label="Cambiar idioma">EN</button>

<div class="login-card">
  <div class="logo-wrap">
    <div class="logo"><img src="https://files.catbox.moe/qxl7dn.png" alt="Vantarmor" style="width:100%;height:100%;object-fit:cover;display:block"></div>
  </div>

  <h1 class="title" data-i18n="login_title">Bienvenido de vuelta</h1>
  <p class="subtitle" data-i18n="login_subtitle">Inicia sesión para acceder a tu panel</p>

  <div id="statusMsg" class="status"></div>

  <a href="/auth/discord" class="btn-discord">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
    </svg>
    <span data-i18n="login_discord">Continuar con Discord</span>
  </a>

  <div class="divider" data-i18n="login_divider">o con email</div>

  <form id="loginForm" autocomplete="off">
    <div class="field">
      <label for="email" data-i18n="login_email">Email</label>
      <div class="input-wrap">
        <input type="email" id="email" placeholder="tu@correo.com" required>
      </div>
    </div>

    <div class="field">
      <label for="password" data-i18n="login_password">Contraseña</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
    </div>

    <button type="submit" class="btn-submit" data-i18n="login_submit">Iniciar sesión</button>
  </form>

  <div class="links">
    <a href="#" data-i18n="login_forgot">¿Olvidaste tu contraseña?</a>
    <a href="#" class="register" data-i18n="login_register">Crear cuenta</a>
  </div>

  <div class="card-footer">
    © 2026 <a href="/">Vantarmor</a>
  </div>
</div>

<script src="/i18n.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const statusMsg = document.getElementById('statusMsg');
  const T = (k, es) => (window.vmT && window.vmT(k)) || es;

  if (params.get('error')) {
    statusMsg.className = 'status error';
    const errors = {
      no_code: T('login_err_no_code', 'No se recibió el código de Discord'),
      token_failed: T('login_err_token', 'Error al obtener el token'),
      server: T('login_err_server', 'Error interno del servidor')
    };
    statusMsg.textContent = errors[params.get('error')] || T('login_err_default', 'Error al iniciar sesión');
  }

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    statusMsg.className = 'status error';
    statusMsg.textContent = T('login_soon', 'Login con email próximamente. Usa Discord por ahora.');
  });
</script>

</body>
  </html>
