{% extends "base.html" %}{% block title %}Edit script · VantaProtect{% endblock %}{% block content %}<section class="hero"><h1>Edit script</h1></section><div class="card" style="max-width:720px"><form id="editForm"><div class="field"><label>Name</label><input id="name" value="{{ script.name }}" required></div><div class="field"><label>Description</label><textarea id="description" rows="5">{{ script.description or '' }}</textarea></div><button class="btn btn-primary">Save changes</button></form></div>{% endblock %}{% block extra_js %}<script>editForm.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch(location.pathname,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,description:description.value})});const d=await r.json();showToast(d.success?'Saved':d.error,d.success?'success':'error')})</script>{% endblock %}
