<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ prices.title }} · VantaProtect</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>:root{color-scheme:dark;--bg:#07080d;--card:#111522;--line:#282f43;--text:#f5f7fb;--muted:#98a1b5;--accent:{{ prices.color or '#8b5cf6' }}}*{box-sizing:border-box}body{margin:0;background:radial-gradient(700px 400px at 50% -10%,color-mix(in srgb,var(--accent) 25%,transparent),transparent 70%),var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(760px,100%);background:rgba(17,21,34,.92);border:1px solid var(--line);border-radius:20px;padding:40px;box-shadow:0 30px 80px #0008}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:700}h1{font:700 40px 'Space Grotesk';margin:10px 0}p,pre{color:var(--muted);line-height:1.7}pre{white-space:pre-wrap;font:inherit;background:#0a0d15;border:1px solid var(--line);border-radius:12px;padding:20px;color:var(--text)}a{color:var(--accent)}</style></head><body><main class="card"><div class="eyebrow">VantaProtect</div><h1>{{ prices.title }}</h1><p>{{ prices.description }}</p><pre>{{ prices.body }}</pre><a href="/">Volver al inicio</a></main></body></html>
