<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}VantaProtect{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{--bg:#07080d;--surface:#0d1018;--surface2:#121622;--surface3:#181d2b;--line:#242a3a;--muted:#7e879c;--text:#f5f7fb;--purple:#8b5cf6;--purple2:#6d43e8;--cyan:#52d6ff;--green:#44e3a0;--red:#ff6b82}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(900px 450px at 70% -10%,rgba(109,67,232,.18),transparent 65%),var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}h1,h2,h3,h4,.brand{font-family:'Space Grotesk',sans-serif}a{color:inherit;text-decoration:none}button{font-family:inherit}.scroll{overflow:auto}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#2a3042;border-radius:10px}
    .shell{display:flex;min-height:100vh}.sidebar{width:256px;flex:0 0 256px;background:rgba(10,12,19,.92);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:20}.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;letter-spacing:-.04em;padding:8px 10px 25px}.brand-mark{width:30px;height:30px;display:grid;place-items:center;border:1px solid #5741a8;background:linear-gradient(145deg,#261e4c,#151129);border-radius:9px;color:#b8a2ff;box-shadow:0 0 24px rgba(139,92,246,.2)}.brand em{font-style:normal;color:#a78bfa}.brand small{font-family:'DM Sans';font-size:9px;color:#8d78dc;border:1px solid #403275;padding:3px 6px;border-radius:5px;margin-left:auto;letter-spacing:.08em}.nav-title{font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:#596176;font-weight:700;padding:14px 12px 7px}.nav-item{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:8px;color:#858da1;font-size:12px;margin:2px 0;transition:.18s}.nav-item i{width:16px;text-align:center;font-size:13px;color:#687188}.nav-item:hover{background:#151a27;color:#f8f9ff}.nav-item.active{background:linear-gradient(90deg,rgba(139,92,246,.2),rgba(139,92,246,.05));color:#d5caff;box-shadow:inset 2px 0 var(--purple)}.nav-item.active i{color:#b39aff}.nav-badge{margin-left:auto;color:#a998e7;font-size:10px}.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}.profile{display:flex;gap:10px;align-items:center;padding:8px}.avatar{width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,#38246d,#16112b);display:grid;place-items:center;color:#c9baff;font-weight:700;font-size:12px}.profile b{display:block;font-size:12px}.profile span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.logout{display:block;color:#727b90;font-size:11px;padding:8px 10px}.logout:hover{color:var(--red)}.invite{display:flex;align-items:center;gap:9px;margin:12px 4px 5px;padding:10px 11px;background:linear-gradient(135deg,#7c45ed,#552db8);border-radius:8px;font-size:11px;font-weight:700;box-shadow:0 9px 22px rgba(92,45,184,.25)}.invite i:last-child{margin-left:auto;font-size:9px;opacity:.7}
    .main{min-width:0;flex:1}.topbar{height:66px;border-bottom:1px solid rgba(36,42,58,.8);display:flex;align-items:center;justify-content:space-between;padding:0 34px;background:rgba(7,8,13,.56);backdrop-filter:blur(16px);position:sticky;top:0;z-index:10}.crumb{font-size:11px;color:#788198}.crumb strong{color:#dfe3ef;font-weight:600}.bot-state{display:flex;align-items:center;gap:8px;font-size:10px;color:#7e899e;text-transform:uppercase;letter-spacing:.08em}.bot-state:before{content:'';width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 10px var(--green)}.content{padding:34px;max-width:1500px}.eyebrow{color:#a996ed;text-transform:uppercase;letter-spacing:.17em;font-weight:700;font-size:10px}.hero{border:1px solid #30265a;background:linear-gradient(112deg,rgba(33,25,63,.92),rgba(15,18,28,.82) 72%);border-radius:15px;padding:28px 30px;position:relative;overflow:hidden;margin-bottom:24px}.hero:after{content:'';position:absolute;width:290px;height:290px;border-radius:50%;right:-90px;top:-150px;background:rgba(139,92,246,.18);filter:blur(4px)}.hero h1{font-size:32px;letter-spacing:-.06em;margin:8px 0}.hero p{color:#98a1b5;font-size:13px;line-height:1.7;max-width:650px;margin:0}.hero-actions{display:flex;gap:10px;margin-top:20px;position:relative;z-index:2}.btn{border:0;border-radius:8px;padding:10px 15px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:8px;cursor:pointer}.btn-primary{background:linear-gradient(135deg,#9568ff,#7046dd);color:white;box-shadow:0 8px 20px rgba(112,70,221,.2)}.btn-primary:hover{filter:brightness(1.12)}.btn-ghost{background:#171b27;border:1px solid #2b3245;color:#bdc4d3}.card{background:rgba(13,16,24,.84);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 15px 45px rgba(0,0,0,.14)}.card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.card-title h3{font-size:14px;margin:0}.muted{color:var(--muted);font-size:11px}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.stat{padding:17px 18px;background:rgba(13,16,24,.88);border:1px solid var(--line);border-radius:11px}.stat-label{font-size:10px;color:#7d879c;text-transform:uppercase;letter-spacing:.09em}.stat-value{font-family:'Space Grotesk';font-size:28px;font-weight:700;margin-top:9px;letter-spacing:-.06em}.stat-foot{font-size:10px;color:#697389;margin-top:6px}.stat-icon{float:right;color:#a78bfa;font-size:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.table-container{border:1px solid var(--line);border-radius:9px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th{background:#0b0e15;color:#697389;text-transform:uppercase;font-size:9px;letter-spacing:.1em;text-align:left;padding:12px;border-bottom:1px solid var(--line)}td{font-size:11px;padding:12px;border-bottom:1px solid #1c2230;color:#cbd1df}tr:hover td{background:#121724}.empty{text-align:center;padding:34px;color:#697389}.empty i{display:block;color:#453675;font-size:24px;margin-bottom:10px}.field label{display:block;color:#8992a6;font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}.field input,.field textarea,.field select,input,textarea,select{width:100%;background:#090c13;border:1px solid #272e40;border-radius:8px;color:#e9ecf5;padding:10px 11px;font:inherit;font-size:12px}.field input:focus,.field textarea:focus,input:focus,textarea:focus,select:focus{outline:none;border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.12)}.toast{position:fixed;right:24px;bottom:24px;background:#171b27;border:1px solid #3b315f;padding:12px 16px;border-radius:9px;font-size:11px;opacity:0;transform:translateY(10px);transition:.2s;z-index:50}.toast.show{opacity:1;transform:none}.menu-toggle{display:none}
    @media(max-width:900px){.sidebar{width:224px;flex-basis:224px}.content{padding:24px}.topbar{padding:0 24px}.stat-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.sidebar{position:fixed;transform:translateX(-100%);transition:.2s;width:260px}.sidebar.open{transform:none}.menu-toggle{display:grid;place-items:center;position:fixed;left:14px;top:14px;z-index:30;width:36px;height:36px;border-radius:8px;background:#171b27;border:1px solid var(--line);color:white}.topbar{padding-left:64px}.grid2{grid-template-columns:1fr}.stat-grid{grid-template-columns:1fr 1fr}.content{padding:18px 14px}.hero{padding:22px 20px}.hero h1{font-size:26px}.hero-actions{flex-wrap:wrap}}
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  {% block extra_css %}{% endblock %}
</head>
<body>
<button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
<div class="shell">
<aside class="sidebar" id="sidebar">
  <a class="brand" href="/dashboard"><span class="brand-mark"><i class="fas fa-shield-halved"></i></span><span>Vanta<em>.vs</em></span><small>PRO</small></a>
  <nav>
    <div class="nav-title">Workspace</div>
    <a class="nav-item {% if request.path == '/dashboard' %}active{% endif %}" href="/dashboard"><i class="fas fa-grid-2"></i><span>Overview</span></a>
    <a class="nav-item {% if request.path == '/scripts' %}active{% endif %}" href="/scripts"><i class="fas fa-folder-open"></i><span>Scripts</span><span class="nav-badge">{{ scripts|length if scripts else 0 }}</span></a>
    <a class="nav-item {% if request.path == '/protector' %}active{% endif %}" href="/protector"><i class="fas fa-code"></i><span>Obfuscator</span></a>
    <a class="nav-item {% if request.path == '/panel' %}active{% endif %}" href="/panel"><i class="fas fa-sliders"></i><span>API key</span></a>
    <div class="nav-title">Protection</div>
    <a class="nav-item {% if request.path == '/keys' %}active{% endif %}" href="/keys"><i class="fas fa-key"></i><span>License keys</span><span class="nav-badge">{{ keys|length if keys else 0 }}</span></a>
    <a class="nav-item {% if request.path == '/hwid-bans' %}active{% endif %}" href="/hwid-bans"><i class="fas fa-fingerprint"></i><span>HWID bans</span></a>
    <a class="nav-item {% if request.path == '/logs' %}active{% endif %}" href="/logs"><i class="fas fa-list-check"></i><span>Logs</span></a>
    <div class="nav-title">Panels</div>
    <a class="nav-item" href="/panel"><i class="fas fa-plus"></i><span>Create New Panel</span></a>

    <a class="nav-item" href="/prices"><i class="fas fa-receipt"></i><span>Prices</span></a>
    <a class="nav-item" href="/updates"><i class="fas fa-bullhorn"></i><span>Updates</span></a><a class="nav-item {% if request.path == '/chat' %}active{% endif %}" href="/chat"><i class="fas fa-comments"></i><span>Community chat</span></a>
    {% if user.is_admin %}<div class="nav-title">Owner</div><a class="nav-item {% if request.path == '/users' %}active{% endif %}" href="/users"><i class="fas fa-file-lines"></i><span>Published TXT</span></a>{% endif %}
  </nav>
  <a class="invite" href="https://discord.com/oauth2/authorize?client_id={{ discord_client_id|default('1519073151856803930') }}&permissions=8&scope=bot" target="_blank"><i class="fab fa-discord"></i><span>Connect Discord bot</span><i class="fas fa-arrow-right"></i></a>
  <div class="sidebar-bottom"><div class="profile"><div class="avatar">{% if user.avatar %}<img src="{{ user.avatar }}" alt="{{ user.username }}">{% else %}<i class="fas fa-user"></i>{% endif %}</div><div><b>{{ user.username }}</b><span>{{ 'Administrator' if user.is_admin else 'Workspace member' }}</span></div></div><a class="logout" href="/logout"><i class="fas fa-arrow-right-from-bracket"></i> Sign out</a></div>
</aside>
<section class="main"><header class="topbar"><div class="crumb">Workspace <span style="color:#4e5669">/</span> <strong>{% block crumb %}Overview{% endblock %}</strong></div><div class="bot-state">Bot online</div></header><main class="content">{% block content %}{% endblock %}</main></section>
</div><div id="toast" class="toast"></div>
<script>const sb=document.getElementById('sidebar'),mt=document.getElementById('menuToggle');mt?.addEventListener('click',()=>sb.classList.toggle('open'));function showToast(m,t='success'){const x=document.getElementById('toast');x.textContent=m;x.className='toast '+t+' show';setTimeout(()=>x.classList.remove('show'),3500)}function copiarTexto(v){navigator.clipboard?.writeText(v);showToast('Copied to clipboard')}function confirmarAccion(m){return confirm(m)}{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}showToast('{{ m }}','{{ c }}');{% endfor %}{% endwith %}</script>{% block extra_js %}{% endblock %}
</body></html>
